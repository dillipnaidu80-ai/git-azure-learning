trigger:
  - main

pool:
  vmImage: ubuntu-latest

stages:

# =========================
# BUILD
# =========================

- stage: Build
  displayName: Build and Test

  jobs:

  - job: BuildTest

    steps:

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.13'
      displayName: 'Use Python 3.13'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: 'Install dependencies'

    - script: |
        pytest
      displayName: 'Run tests'

    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: '$(Build.SourcesDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/python-app.zip'
        replaceExistingArchive: true
      displayName: 'Create deployment package'

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/python-app.zip'
        artifact: 'python-app'
      displayName: 'Publish artifact'


# =========================
# DEV
# =========================

- stage: Deploy_DEV
  displayName: Deploy to DEV
  dependsOn: Build

  jobs:

  - deployment: DeployDEV
    displayName: Deploy Python App to DEV

    environment: DEV

    strategy:
      runOnce:
        deploy:

          steps:

          - download: current
            artifact: python-app

          - script: |
              echo "Deploying python-app.zip to DEV"
              ls -R $(Pipeline.Workspace)/python-app
            displayName: 'Deploy to DEV'


# =========================
# QA
# =========================

- stage: Deploy_QA
  displayName: Deploy to QA
  dependsOn: Deploy_DEV

  jobs:

  - deployment: DeployQA
    displayName: Deploy Python App to QA

    environment: QA

    strategy:
      runOnce:
        deploy:

          steps:

          - download: current
            artifact: python-app

          - script: |
              echo "Deploying python-app.zip to QA"
              ls -R $(Pipeline.Workspace)/python-app
            displayName: 'Deploy to QA'


# =========================
# PROD
# =========================

- stage: Deploy_PROD
  displayName: Deploy to PROD
  dependsOn: Deploy_QA

  jobs:

  - deployment: DeployPROD
    displayName: Deploy Python App to PROD

    environment: PROD

    strategy:
      runOnce:
        deploy:

          steps:

          - download: current
            artifact: python-app

          - script: |
              echo "Deploying python-app.zip to PROD"
              ls -R $(Pipeline.Workspace)/python-app
            displayName: 'Deploy to PROD'