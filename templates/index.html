<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Azure DevOps Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 700px;
            margin: 100px auto;

            color: #2e7d32;
        }

<body>

<div class="container">

    <h1>🚀 Azure DevOps Demo</h1>

    <p>
        Python Flask application deployed through CI/CD.
    </p>

    <div class="status">

    </div>

</div>

</html>
